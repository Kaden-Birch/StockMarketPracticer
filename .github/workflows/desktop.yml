# Desktop installer builds (Tauri 2 + PyInstaller sidecar).
# Runs on version tags; produces NSIS (Windows), DMG (macOS universal via two
# runners), and deb/rpm/AppImage (Linux) as release artifacts.
#
# NOTE: this workflow is scaffolding from milestone M3 and has not been
# exercised yet — expect the first tagged run to need iteration.

name: Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze server sidecar
        shell: bash
        run: |
          pip install pyinstaller ./backend
          pyinstaller --onefile --name aiptp-server \
            --collect-all aiptp --hidden-import uvicorn.logging \
            backend/aiptp/main.py
          mkdir -p desktop/src-tauri/binaries
          EXT=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then EXT=".exe"; fi
          mv "dist/aiptp-server$EXT" \
             "desktop/src-tauri/binaries/aiptp-server-${{ matrix.target }}$EXT"

      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: "AIPTP ${{ github.ref_name }}"
          releaseDraft: true
