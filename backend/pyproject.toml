[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiptp"
version = "0.1.0"
description = "AI Paper Trading Platform — core application server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
aiptp = "aiptp.main:run"

[tool.setuptools.packages.find]
include = ["aiptp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
